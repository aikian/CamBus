name: Deploy to GitHub Pages
on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: yu-campus-bus
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
