<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f0">
  <title>캠퍼스 선택 · CamBus</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script src="profile.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const choosing = params.get('campus') === 'select';
    params.delete('campus');
    const destination = './yeungnam.html' + (params.size ? '?' + params : '') + location.hash;
    try {
      if (choosing) history.replaceState(null, '', location.pathname + (params.size ? '?' + params : '') + location.hash);
      if (!choosing && localStorage.getItem('cambus.campus') === 'yeungnam') location.replace(destination);
    } catch {}
  </script>
  <style>
    :root { color-scheme:light; --ink:#1b2522; --paper:#f7f7f0; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; background:var(--paper); color:var(--ink); font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif; }
    .wrap { width:min(100% - 40px,1040px); margin:auto; }
    header { border-bottom:1px solid #cdd2c8; }
    .brand { height:72px; display:flex; align-items:center; gap:10px; font-size:26px; letter-spacing:-1.4px; font-weight:850; }
    main { padding:clamp(38px,8vh,98px) 0 48px; }
    .category { margin:0 0 14px; color:#405f47; font-size:15px; font-weight:750; }
    h1 { margin:0; font-size:clamp(37px,6.5vw,70px); letter-spacing:-.075em; line-height:1.13; }
    .intro { margin:14px 0 clamp(24px,4vh,42px); color:#4f5b51; font-size:clamp(15px,2vw,19px); line-height:1.65; word-break:keep-all; }
    .campus { display:grid; grid-template-columns:1fr 1.13fr; color:inherit; text-decoration:none; border:1px solid #bcc6b9; background:#fff; border-radius:22px; overflow:hidden; box-shadow:0 5px 0 #e2e5da; }
    .campus:focus-visible { outline:4px solid #135d4c; outline-offset:5px; }
    .info { display:flex; flex-direction:column; align-items:flex-start; justify-content:center; padding:clamp(26px,4vw,52px); }
    .region { font-size:14px; color:#546256; }
    h2 { margin:8px 0; font-size:clamp(29px,4vw,44px); letter-spacing:-.065em; }
    .subtitle { margin:0; font-size:15px; color:#47534b; }
    .enter { margin-top:28px; padding:13px 18px; border-radius:10px; background:#ffe245; font-weight:800; }
    .campus:hover .enter { background:#f2d026; }
    .enter span { margin-left:16px; }
    .map { position:relative; min-height:290px; background-color:#203c33; background-image:linear-gradient(#b3d9ab12 1px,transparent 1px),linear-gradient(90deg,#b3d9ab12 1px,transparent 1px); background-size:22px 22px; }
    h1 { word-break:keep-all; text-wrap:balance; }
    canvas { width:100%; height:100%; position:absolute; inset:0; }
    @media(max-width:620px) {
      .wrap { width:calc(100% - 36px); } .brand { height:58px; font-size:23px; }
      .campus { display:flex; flex-direction:column-reverse; } main { padding-top:32px; } .info { padding:22px; }
      .map { min-height:clamp(150px,25vh,230px); } .enter { margin-top:20px; width:100%; display:flex; justify-content:space-between; }
    }
  </style>
</head>
<body>
  <header><div class="wrap brand"><img src="icon.svg" width="32" height="32" alt="">CamBus</div></header>
  <main class="wrap">
    <p class="category">로컬대학문화</p>
    <h1>어느 캠퍼스로 갈까요?</h1>
    <p class="intro">캠퍼스를 고르면 다음 방문부터 바로 열립니다.</p>
    <a class="campus" id="campusChoice" href="./yeungnam.html">
      <div class="info">
        <span class="region">경북 경산</span><h2>영남대학교</h2><p class="subtitle">경산캠퍼스</p>
        <span class="enter">영남대 캠퍼스로 입장 <span aria-hidden="true">→</span></span>
      </div>
      <div class="map" aria-hidden="true"><canvas></canvas></div>
    </a>
  </main>
  <script>
    const choice = document.getElementById('campusChoice');
    choice.href = destination;

    async function drawCampusMap() {
      const {routes} = await fetch('./data/route-paths.json').then(r => r.json());
      const canvas = document.querySelector('canvas');
      const ctx = canvas.getContext('2d');
      const paths = [routes.r1, routes.r2];
      const points = paths.flatMap(r => r.geometry);
      const lats = points.map(p => p[0]), lngs = points.map(p => p[1]);
      const west = Math.min(...lngs), north = Math.max(...lats);
      const extentX = (Math.max(...lngs) - west) * Math.cos(north * Math.PI / 180);
      const extentY = north - Math.min(...lats);
      function draw() {
        const {width, height} = canvas.getBoundingClientRect();
        const pixelRatio = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * pixelRatio); canvas.height = Math.round(height * pixelRatio);
        ctx.setTransform(pixelRatio,0,0,pixelRatio,0,0);
        const scale = Math.min((width-56)/extentX, (height-45)/extentY);
        const project = ([lat,lng]) => [(width-extentX*scale)/2 + (lng-west)*Math.cos(north*Math.PI/180)*scale,
          (height-extentY*scale)/2 + (north-lat)*scale];
        paths.forEach((route, i) => {
          ctx.beginPath();
          route.geometry.forEach((p, j) => { const [x,y]=project(p); if (j) ctx.lineTo(x,y); else ctx.moveTo(x,y); });
          ctx.lineWidth=4; ctx.lineJoin='round'; ctx.strokeStyle=i ? '#9bd7cb' : '#ffdc58'; ctx.stroke();
          route.stopCoords.forEach(p => {
            ctx.beginPath(); ctx.arc(...project(p),3.5,0,Math.PI*2); ctx.fillStyle='#1e392f'; ctx.fill();
            ctx.lineWidth=1.8; ctx.stroke();
          });
        });
        ctx.fillStyle='#f4f6e8'; ctx.font='600 12px sans-serif';
        [['서문',routes.r1,5],['박물관',routes.r1,0],['기계관',routes.r2,3]].forEach(([label,route,index]) => {
          const [x,y] = project(route.stopCoords[index]);
          ctx.fillText(label,x+6,y-5);
        });
      }
      draw(); new ResizeObserver(draw).observe(canvas);
    }
    drawCampusMap().catch(() => {});
  </script>
</body>
</html>
